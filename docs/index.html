<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Répétition Espacée</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6200ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RépEspacée">
  <style>
    :root {
      --primary: #6200ee;
      --primary-dark: #3700b3;
      --surface: #ffffff;
      --bg: #f3f0ff;
      --on-surface: #1a1a1a;
      --muted: #757575;
      --error: #b00020;
      --ok: #2e7d32;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--on-surface);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--primary);
      color: #fff;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1 { font-size: 19px; font-weight: 700; }

    /* ── Content ── */
    main { padding: 14px; padding-bottom: 90px; }

    /* ── Empty state ── */
    #empty {
      text-align: center;
      padding: 70px 24px;
      color: var(--muted);
    }
    #empty .ico { font-size: 64px; margin-bottom: 16px; }
    #empty p { font-size: 15px; line-height: 1.6; }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
      cursor: pointer;
      transition: box-shadow .15s;
    }
    .card:active { box-shadow: 0 0 0 rgba(0,0,0,.05); }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; }
    .card-book { font-size: 16px; font-weight: 700; flex: 1; padding-right: 8px; }
    .card-del {
      background: none; border: none; font-size: 20px;
      cursor: pointer; padding: 2px 4px; color: var(--muted);
    }
    .card-info { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .card-badge {
      display: inline-block; margin-top: 8px;
      padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
    }
    .b-faible    { background:#ffebee; color:#c62828; }
    .b-moyen     { background:#fff3e0; color:#e65100; }
    .b-fort      { background:#e8f5e9; color:#2e7d32; }
    .b-excellent { background:#e8eaf6; color:#283593; }
    .card-next { font-size: 12px; color: var(--primary); margin-top: 8px; font-style: italic; }
    .card-done { font-size: 12px; color: var(--ok); margin-top: 8px; }

    /* ── FAB ── */
    #fab {
      position: fixed; bottom: 22px; right: 22px;
      width: 58px; height: 58px; border-radius: 50%;
      background: var(--primary); color: #fff; border: none;
      font-size: 30px; cursor: pointer;
      box-shadow: 0 4px 14px rgba(98,0,238,.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; transition: transform .15s;
    }
    #fab:active { transform: scale(.92); }

    /* ── Overlay ── */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.5); z-index: 200;
      align-items: flex-end; justify-content: center;
    }
    .overlay.open { display: flex; }

    /* ── Sheet ── */
    .sheet {
      background: #fff; border-radius: 22px 22px 0 0;
      padding: 24px; width: 100%; max-height: 92vh; overflow-y: auto;
      animation: slideUp .2s ease;
    }
    @keyframes slideUp { from { transform: translateY(60px); opacity:.5; } }
    .sheet-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }

    /* ── Form ── */
    .fg { margin-bottom: 14px; }
    .fg label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
    .fg input, .fg select {
      width: 100%; padding: 12px 14px;
      border: 2px solid #e0e0e0; border-radius: 10px;
      font-size: 16px; outline: none; background: #fff;
      color: var(--on-surface); transition: border-color .2s;
    }
    .fg input:focus, .fg select:focus { border-color: var(--primary); }

    /* ── Buttons ── */
    .btn-row { display: flex; gap: 10px; margin-top: 18px; }
    .btn {
      flex: 1; padding: 14px; border-radius: 10px;
      border: none; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: opacity .15s;
    }
    .btn:active { opacity: .8; }
    .btn-p { background: var(--primary); color: #fff; }
    .btn-s { background: #ede7ff; color: var(--primary); }

    /* ── Review list ── */
    .rev-item {
      display: flex; align-items: center; padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .rev-item:last-child { border-bottom: none; }
    .rev-label { font-weight: 700; font-size: 14px; width: 46px; color: var(--primary); }
    .rev-date  { font-size: 14px; flex: 1; }
    .rev-ico   { font-size: 17px; }
    .rev-past  { opacity: .45; }

    .meta { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  </style>
</head>
<body>

<header>
  <span style="font-size:22px">📚</span>
  <h1>Répétition Espacée</h1>
</header>

<main>
  <div id="empty">
    <div class="ico">📖</div>
    <p>Aucune session.<br>Appuie sur <strong>+</strong> pour en ajouter une.</p>
  </div>
  <div id="list"></div>
</main>

<button id="fab" onclick="openAdd()">+</button>

<!-- ── Fiche d'ajout ── -->
<div class="overlay" id="addSheet" onclick="bgClose(event,'addSheet')">
  <div class="sheet">
    <div class="sheet-title">Nouvelle session</div>
    <form id="addForm" onsubmit="addSession(event)">
      <div class="fg">
        <label>Nom du livre / section</label>
        <input id="iBook" type="text" placeholder="Ex : Sourate Al-Baqara v.1-5" required>
      </div>
      <div class="fg">
        <label>Nombre de pages apprises</label>
        <input id="iPages" type="number" min="1" placeholder="Ex : 3" required>
      </div>
      <div class="fg">
        <label>Nombre de répétitions effectuées</label>
        <input id="iReps" type="number" min="1" placeholder="Ex : 10" required>
      </div>
      <div class="fg">
        <label>Degré de maîtrise</label>
        <select id="iMastery">
          <option value="faible">😰 Faible — beaucoup d'hésitations</option>
          <option value="moyen" selected>🙂 Moyen — quelques erreurs</option>
          <option value="fort">💪 Fort — très peu d'erreurs</option>
          <option value="excellent">🌟 Excellent — par cœur, de tête</option>
        </select>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-s" onclick="closeSheet('addSheet')">Annuler</button>
        <button type="submit" class="btn btn-p">Ajouter ✓</button>
      </div>
    </form>
  </div>
</div>

<!-- ── Fiche de détail ── -->
<div class="overlay" id="detailSheet" onclick="bgClose(event,'detailSheet')">
  <div class="sheet" id="detailBody"></div>
</div>

<script>
// ── Intervalles de révision ────────────────────────────────────────────────

const INTERVALS = {
  faible:    [1, 2, 3, 5, 7, 14, 30, 45, 60, 90],
  moyen:     [1, 3, 5, 7, 14, 30, 45, 60, 90],
  fort:      [1, 3, 5, 7, 14, 30, 45, 60, 90],
  excellent: [5, 7, 14, 30, 45, 60, 90]
};

const DAY = 86400000;

function reviews(startMs, mastery) {
  return (INTERVALS[mastery] || INTERVALS.moyen).map(d => ({
    label: 'J' + d, dateMs: startMs + d * DAY
  }));
}

// ── Storage ────────────────────────────────────────────────────────────────

const load = () => { try { return JSON.parse(localStorage.getItem('srSessions') || '[]'); } catch { return []; } };
const save = s  => localStorage.setItem('srSessions', JSON.stringify(s));

// ── Helpers ────────────────────────────────────────────────────────────────

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function fmtDate(ms) {
  return new Date(ms).toLocaleDateString('fr-FR', {
    weekday:'short', day:'numeric', month:'short', year:'numeric'
  });
}

const LABELS = { faible:'Faible', moyen:'Moyen', fort:'Fort', excellent:'Excellent' };
const BADGES = { faible:'b-faible', moyen:'b-moyen', fort:'b-fort', excellent:'b-excellent' };

// ── Render ─────────────────────────────────────────────────────────────────

function render() {
  const sessions = load();
  const now = Date.now();
  document.getElementById('empty').style.display = sessions.length ? 'none' : 'block';
  document.getElementById('list').innerHTML = sessions.map(s => {
    const rv = reviews(s.startMs, s.mastery);
    const next = rv.find(r => r.dateMs > now);
    const nextHtml = next
      ? `<div class="card-next">⏰ Prochaine : ${next.label} — ${fmtDate(next.dateMs)}</div>`
      : `<div class="card-done">✅ Toutes les révisions terminées</div>`;
    return `
      <div class="card" onclick="showDetail('${s.id}')">
        <div class="card-head">
          <div class="card-book">${esc(s.book)}</div>
          <button class="card-del" onclick="del(event,'${s.id}')">🗑️</button>
        </div>
        <div class="card-info">${s.pages} page${s.pages>1?'s':''} · ${s.reps} répétition${s.reps>1?'s':''}</div>
        <span class="card-badge ${BADGES[s.mastery]}">${LABELS[s.mastery]}</span>
        ${nextHtml}
      </div>`;
  }).join('');
}

// ── Actions ────────────────────────────────────────────────────────────────

function addSession(e) {
  e.preventDefault();
  const sessions = load();
  sessions.unshift({
    id: Date.now().toString(),
    book: document.getElementById('iBook').value.trim(),
    pages: +document.getElementById('iPages').value,
    reps:  +document.getElementById('iReps').value,
    mastery: document.getElementById('iMastery').value,
    startMs: Date.now()
  });
  save(sessions);
  closeSheet('addSheet');
  document.getElementById('addForm').reset();
  render();
}

function del(e, id) {
  e.stopPropagation();
  if (!confirm('Supprimer cette session ?')) return;
  save(load().filter(s => s.id !== id));
  render();
}

function showDetail(id) {
  const s = load().find(s => s.id === id);
  if (!s) return;
  const now = Date.now();
  const rv = reviews(s.startMs, s.mastery);
  const rows = rv.map(r => {
    const past = r.dateMs <= now;
    return `<div class="rev-item ${past ? 'rev-past' : ''}">
      <span class="rev-label">${r.label}</span>
      <span class="rev-date">${fmtDate(r.dateMs)}</span>
      <span class="rev-ico">${past ? '✅' : '⏳'}</span>
    </div>`;
  }).join('');
  document.getElementById('detailBody').innerHTML = `
    <div class="sheet-title">${esc(s.book)}</div>
    <div class="meta">${s.pages} page${s.pages>1?'s':''} · ${s.reps} répétition${s.reps>1?'s':''}</div>
    <div class="meta">
      <span class="card-badge ${BADGES[s.mastery]}">${LABELS[s.mastery]}</span>
      &nbsp;Démarré le ${fmtDate(s.startMs)}
    </div>
    <div style="margin-top:16px;font-size:14px;font-weight:700">Planning des révisions</div>
    <div style="margin-top:8px">${rows}</div>
    <div class="btn-row"><button class="btn btn-p" onclick="closeSheet('detailSheet')">Fermer</button></div>
  `;
  document.getElementById('detailSheet').classList.add('open');
}

// ── Sheet helpers ──────────────────────────────────────────────────────────

function openAdd()          { document.getElementById('addSheet').classList.add('open'); setTimeout(()=>document.getElementById('iBook').focus(),200); }
function closeSheet(id)     { document.getElementById(id).classList.remove('open'); }
function bgClose(e, id)     { if (e.target === e.currentTarget) closeSheet(id); }

// ── Init ───────────────────────────────────────────────────────────────────

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
