name: Build APK

on:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Setup Android SDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDK_TOOLS="$SDK_ROOT/cmdline-tools/latest/bin"
          yes | "$SDK_TOOLS/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK_TOOLS/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Répétition Espacée — Dernière version"
          body: |
            ## Télécharger l'APK Android

            👇 Clique sur **RepetitionEspacee.apk** ci-dessous pour le télécharger sur ton téléphone.

            **Avant d'installer :**
            Paramètres → Sécurité → Active « Sources inconnues »
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          prerelease: false
